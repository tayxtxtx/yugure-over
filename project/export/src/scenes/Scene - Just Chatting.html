<style>
  /* In-stream overlay: BODY MUST BE TRANSPARENT so OBS composites it on the webcam. */
  html, body {
    margin: 0; padding: 0;
    background: transparent;
    overflow: hidden;
    font-family: 'Manrope', system-ui, sans-serif;
    color: #f4ecd8;
  }
  /* Browser-preview backdrop — checker pattern so transparent regions are visible.
     OBS sized at 1920×1080 only sees the inner stage at scale=1, ignoring this. */
  #preview-backdrop {
    position: fixed; inset: 0;
    background:
      repeating-conic-gradient(#1a1a2a 0 25%, #0a0a16 0 50%) 50% / 40px 40px;
    z-index: -1;
  }
  #stage-wrap {
    position: fixed; inset: 0;
    display: grid;
    place-items: center;
  }
  #stage {
    width: 1920px;
    height: 1080px;
    transform-origin: center center;
    position: relative;
  }
  @keyframes livePulse {
    0%, 100% { box-shadow: 0 0 12px #ff5b5b, 0 0 0 4px rgba(255,91,91,0.18); }
    50%      { box-shadow: 0 0 18px #ff5b5b, 0 0 0 7px rgba(255,91,91,0.05); }
  }
</style>
</head>
<body>

<div id="preview-backdrop"></div>
<div id="stage-wrap"><div id="stage"></div></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="overlays-shared.jsx"></script>
<script type="text/babel" src="overlay-just-chatting.jsx"></script>

<script type="text/babel" data-presets="react">
  ReactDOM.createRoot(document.getElementById('stage'))
    .render(<window.JustChattingOverlay obs={true} />);

  function scaleStage() {
    const s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
    document.getElementById('stage').style.transform = 'scale(' + s + ')';
  }
  window.addEventListener('resize', scaleStage);
  scaleStage();
</script>
