<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Weekly Stream Schedule</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;600;700;800&family=Manrope:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --ink:        #0d1530;
    --ink-2:      #182144;
    --indigo:     #2b2f6e;
    --indigo-2:   #3a3d8a;
    --violet:     #6b5cc7;
    --cyan:       #6cd6e4;
    --cyan-soft:  #9fe4ec;
    --gold:       #e6b558;
    --gold-deep:  #b58536;
    --paper:      #f4ecd8;
    --paper-2:    #ece1c5;
    --sage:       #8fb09a;
    --plum:       #4a2d6b;
  }

  html, body { margin: 0; padding: 0; background: #07091a; }

  .stage {
    width: 1920px;
    height: 1080px;
    position: relative;
    background:
      radial-gradient(1200px 700px at 78% 55%, rgba(108,214,228,0.10), transparent 60%),
      radial-gradient(900px 600px at 18% 30%, rgba(107,92,199,0.18), transparent 60%),
      linear-gradient(150deg, #0d1530 0%, #14193d 45%, #0a1130 100%);
    color: var(--paper);
    font-family: 'Manrope', system-ui, sans-serif;
    overflow: hidden;
    transform-origin: top left;
  }

  /* Seigaiha (Japanese wave) pattern, subtle */
  .stage::before {
    content: "";
    position: absolute; inset: 0;
    background-image:
      radial-gradient(circle at 40px 40px, transparent 22px, rgba(255,255,255,0.025) 22.5px, rgba(255,255,255,0.025) 24px, transparent 24.5px),
      radial-gradient(circle at 40px 40px, transparent 14px, rgba(255,255,255,0.022) 14.5px, rgba(255,255,255,0.022) 16px, transparent 16.5px),
      radial-gradient(circle at 40px 40px, transparent 6px, rgba(255,255,255,0.02) 6.5px, rgba(255,255,255,0.02) 8px, transparent 8.5px);
    background-size: 80px 40px;
    background-position: 0 0, 40px 20px, 0 0;
    opacity: 0.7;
    pointer-events: none;
  }

  /* large washi cloud blooms */
  .cloud {
    position: absolute;
    pointer-events: none;
    opacity: 0.18;
  }

  .layout {
    position: relative;
    width: 100%; height: 100%;
    display: grid;
    grid-template-columns: 1120px 1fr;
    z-index: 2;
  }

  /* ============ LEFT SIDE ============ */
  .left {
    padding: 70px 60px 60px 80px;
    display: flex;
    flex-direction: column;
    gap: 28px;
  }

  .header {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 32px;
    padding-bottom: 22px;
    border-bottom: 1px solid rgba(244,236,216,0.18);
  }

  .header-left {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .kanji-mark {
    font-family: 'Shippori Mincho', serif;
    font-weight: 700;
    font-size: 22px;
    color: var(--cyan);
    letter-spacing: 8px;
    margin-bottom: 6px;
  }

  .title {
    font-family: 'Shippori Mincho', serif;
    font-weight: 800;
    font-size: 92px;
    line-height: 0.95;
    color: var(--paper);
    letter-spacing: -1px;
    margin: 0;
  }

  .title .accent {
    color: var(--gold);
    font-style: italic;
    font-weight: 600;
  }

  .subtitle {
    font-family: 'Manrope', sans-serif;
    font-size: 18px;
    font-weight: 400;
    color: rgba(244,236,216,0.62);
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-top: 14px;
  }

  /* Streamer name seal */
  .seal {
    display: flex;
    align-items: center;
    gap: 18px;
  }

  .seal-stamp {
    width: 92px; height: 92px;
    background: linear-gradient(135deg, #c93b3b 0%, #8a2424 100%);
    border-radius: 8px;
    display: grid;
    place-items: center;
    color: var(--paper);
    font-family: 'Shippori Mincho', serif;
    font-weight: 800;
    font-size: 38px;
    line-height: 1;
    box-shadow: 0 6px 20px rgba(0,0,0,0.4), inset 0 0 0 2px rgba(244,236,216,0.25);
    transform: rotate(-4deg);
    letter-spacing: -2px;
  }

  .seal-info { display: flex; flex-direction: column; gap: 2px; }
  .seal-name {
    font-family: 'Shippori Mincho', serif;
    font-size: 28px;
    font-weight: 700;
    color: var(--paper);
    line-height: 1.1;
  }
  .seal-handle {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    color: var(--cyan-soft);
    letter-spacing: 1px;
  }

  /* Week meta strip */
  .meta {
    display: flex;
    align-items: center;
    gap: 24px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    color: rgba(244,236,216,0.7);
    letter-spacing: 1.5px;
  }
  .meta b { color: var(--gold); font-weight: 600; }
  .meta .dot { width: 4px; height: 4px; background: var(--gold); border-radius: 50%; }

  /* Schedule grid */
  .schedule {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    margin-top: 6px;
  }

  .card {
    position: relative;
    background:
      linear-gradient(180deg, rgba(36,42,82,0.7) 0%, rgba(20,25,55,0.7) 100%);
    border: 1px solid rgba(244,236,216,0.10);
    border-radius: 4px;
    padding: 20px 22px 18px 22px;
    display: grid;
    grid-template-columns: 78px 1fr auto;
    align-items: center;
    gap: 18px;
    overflow: hidden;
  }

  /* gold left edge */
  .card::before {
    content: "";
    position: absolute;
    left: 0; top: 12px; bottom: 12px;
    width: 2px;
    background: linear-gradient(180deg, var(--gold) 0%, rgba(230,181,88,0) 100%);
  }

  .card.off {
    background: linear-gradient(180deg, rgba(20,22,45,0.55) 0%, rgba(12,14,30,0.55) 100%);
    grid-template-columns: 78px 1fr;
  }
  .card.off::before { background: linear-gradient(180deg, rgba(244,236,216,0.25) 0%, transparent 100%); }

  .day-block {
    display: flex; flex-direction: column;
    align-items: flex-start;
    gap: 2px;
  }
  .day-en {
    font-family: 'Shippori Mincho', serif;
    font-weight: 700;
    font-size: 28px;
    color: var(--paper);
    line-height: 1;
  }
  .day-jp {
    font-family: 'Shippori Mincho', serif;
    font-weight: 500;
    font-size: 14px;
    color: var(--cyan);
    letter-spacing: 2px;
  }
  .day-date {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: rgba(244,236,216,0.5);
    margin-top: 4px;
    letter-spacing: 1px;
  }

  .content-block {
    display: flex; flex-direction: column;
    gap: 4px;
    min-width: 0;
  }

  .activity {
    font-family: 'Shippori Mincho', serif;
    font-weight: 600;
    font-size: 22px;
    color: var(--paper);
    line-height: 1.15;
    letter-spacing: 0.2px;
  }
  .activity-sub {
    font-family: 'Manrope', sans-serif;
    font-size: 13px;
    color: rgba(244,236,216,0.55);
    letter-spacing: 0.5px;
  }

  .time-block {
    display: flex; flex-direction: column;
    align-items: flex-end;
    gap: 2px;
  }
  .time {
    font-family: 'JetBrains Mono', monospace;
    font-weight: 600;
    font-size: 22px;
    color: var(--gold);
    letter-spacing: 1px;
    line-height: 1;
  }
  .tz {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: rgba(244,236,216,0.5);
    letter-spacing: 1px;
  }

  .card.off .day-en { color: rgba(244,236,216,0.45); }
  .card.off .day-jp { color: rgba(159,228,236,0.35); }
  .card.off .activity { color: rgba(244,236,216,0.45); font-style: italic; font-weight: 500; }
  .card.off .activity-sub { color: rgba(244,236,216,0.3); }

  .card.featured {
    background:
      radial-gradient(120% 200% at 0% 50%, rgba(108,214,228,0.18) 0%, transparent 50%),
      linear-gradient(180deg, rgba(60,48,120,0.72) 0%, rgba(30,28,75,0.85) 100%);
    border-color: rgba(230,181,88,0.4);
    grid-column: span 2;
    grid-template-columns: 78px 1fr auto;
  }
  .card.featured.has-ribbon {
    grid-template-columns: 78px 1fr 130px auto;
  }
  .card.featured::before {
    background: linear-gradient(180deg, var(--gold) 0%, var(--cyan) 100%);
    width: 3px;
  }
  .card.featured .activity { font-size: 26px; }

  /* Small special star badge */
  .card.special-star::after {
    content: "★";
    position: absolute;
    top: 10px; right: 12px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px; color: var(--gold);
    opacity: 0.9;
  }
  .card.featured .ribbon {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 2px;
    color: var(--gold);
    padding: 5px 10px;
    border: 1px solid var(--gold);
    border-radius: 2px;
    text-transform: uppercase;
    align-self: center;
    white-space: nowrap;
  }

  /* footer */
  .footer {
    margin-top: auto;
    padding-top: 24px;
    border-top: 1px solid rgba(244,236,216,0.12);
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: rgba(244,236,216,0.55);
    letter-spacing: 1.5px;
  }
  .footer .channels { display: flex; gap: 22px; }
  .footer .ch { display: flex; align-items: center; gap: 8px; }
  .footer .ch .glyph {
    width: 18px; height: 18px;
    display: grid; place-items: center;
    border-radius: 50%;
    background: rgba(244,236,216,0.08);
    color: var(--cyan);
    font-size: 10px;
    font-family: 'Shippori Mincho', serif;
  }

  /* ============ RIGHT SIDE ============ */
  .right {
    position: relative;
    overflow: hidden;
  }

  /* Vertical kanji column */
  .vkanji {
    position: absolute;
    top: 60px; right: 60px;
    writing-mode: vertical-rl;
    font-family: 'Shippori Mincho', serif;
    font-weight: 700;
    font-size: 38px;
    color: rgba(244,236,216,0.85);
    letter-spacing: 14px;
    line-height: 1;
    z-index: 5;
  }
  .vkanji small {
    display: block;
    font-size: 13px;
    letter-spacing: 4px;
    color: var(--cyan);
    margin-top: 28px;
    font-family: 'JetBrains Mono', monospace;
    writing-mode: vertical-rl;
  }

  /* Big circular moon behind character */
  .moon {
    position: absolute;
    width: 620px; height: 620px;
    left: 50%; top: 38%;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background:
      radial-gradient(circle at 40% 35%, rgba(108,214,228,0.18) 0%, rgba(108,214,228,0.05) 35%, transparent 65%),
      conic-gradient(from 220deg, rgba(230,181,88,0.55), rgba(108,92,199,0.35), rgba(108,214,228,0.5), rgba(230,181,88,0.55));
    filter: blur(0.5px);
    opacity: 0.85;
    z-index: 1;
  }
  .moon::after {
    content: "";
    position: absolute;
    inset: 6px;
    border-radius: 50%;
    background:
      radial-gradient(circle at 50% 45%, rgba(13,21,48,0.0) 60%, #0d1530 75%),
      radial-gradient(circle at 50% 50%, rgba(108,92,199,0.18), rgba(13,21,48,0.95) 70%);
  }
  .moon-ring {
    position: absolute;
    width: 720px; height: 720px;
    left: 50%; top: 38%;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    border: 1px solid rgba(230,181,88,0.35);
    z-index: 1;
  }
  .moon-ring.outer {
    width: 800px; height: 800px;
    border-style: dashed;
    border-color: rgba(244,236,216,0.12);
  }

  .char-wrap {
    position: absolute;
    inset: 0;
    z-index: 3;
    overflow: visible;
    pointer-events: none;
  }

  .char {
    position: absolute;
    bottom: -40px;
    left: 50%;
    height: 1180px;
    width: auto;
    transform: translateX(-50%);
    filter: drop-shadow(0 30px 40px rgba(0,0,0,0.45)) drop-shadow(0 0 28px rgba(108,214,228,0.18));
  }

  /* small info card overlay on character side */
  .info-card {
    position: absolute;
    bottom: 60px; left: 50px;
    z-index: 6;
    background: rgba(13,21,48,0.78);
    border: 1px solid rgba(230,181,88,0.4);
    backdrop-filter: blur(8px);
    border-radius: 4px;
    padding: 18px 22px;
    display: flex;
    align-items: center;
    gap: 18px;
    min-width: 280px;
  }
  .info-card .live-dot {
    width: 10px; height: 10px;
    background: #ff5b5b;
    border-radius: 50%;
    box-shadow: 0 0 12px #ff5b5b, 0 0 0 4px rgba(255,91,91,0.2);
    flex-shrink: 0;
  }
  .info-card .info-text {
    display: flex; flex-direction: column;
  }
  .info-card .info-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--cyan);
    letter-spacing: 2px;
  }
  .info-card .info-value {
    font-family: 'Shippori Mincho', serif;
    font-size: 18px;
    color: var(--paper);
    font-weight: 600;
  }

  /* corner ornaments */
  .corner {
    position: absolute;
    width: 90px; height: 90px;
    border: 1px solid var(--gold);
    z-index: 4;
    opacity: 0.65;
  }
  .corner.tl { top: 30px; left: 30px; border-right: 0; border-bottom: 0; }
  .corner.tr { top: 30px; right: 30px; border-left: 0; border-bottom: 0; }
  .corner.bl { bottom: 30px; left: 30px; border-right: 0; border-top: 0; }
  .corner.br { bottom: 30px; right: 30px; border-left: 0; border-top: 0; }
  .corner::after {
    content: "";
    position: absolute;
    width: 6px; height: 6px;
    background: var(--gold);
    border-radius: 50%;
  }
  .corner.tl::after { top: -3px; left: -3px; }
  .corner.tr::after { top: -3px; right: -3px; }
  .corner.bl::after { bottom: -3px; left: -3px; }
  .corner.br::after { bottom: -3px; right: -3px; }

</style>
</head>
<body>

<div class="stage" id="stage">

  <!-- corner ornaments -->
  <div class="corner tl"></div>
  <div class="corner tr"></div>
  <div class="corner bl"></div>
  <div class="corner br"></div>

  <!-- wave clouds, decorative -->
  <svg class="cloud" style="top:-80px; left:-60px; width:560px;" viewBox="0 0 200 200">
    <defs>
      <pattern id="wv" x="0" y="0" width="20" height="10" patternUnits="userSpaceOnUse">
        <path d="M0 10 Q5 0 10 10 T20 10" fill="none" stroke="#6cd6e4" stroke-width="0.8"/>
      </pattern>
    </defs>
    <circle cx="100" cy="100" r="95" fill="url(#wv)"/>
  </svg>
  <svg class="cloud" style="bottom:-90px; right:-50px; width:480px; opacity:.1;" viewBox="0 0 200 200">
    <circle cx="100" cy="100" r="95" fill="url(#wv)"/>
  </svg>

  <div class="layout">

    <!-- =================== LEFT =================== -->
    <div class="left">

      <div class="header">
        <div class="header-left">
          <div class="kanji-mark"></div>
          <h1 class="title">Weekly<br/><span class="accent">Schedule</span></h1>
          <div class="subtitle">Stream Lineup · 二尾の猫又 · May 25 — May 31</div>
        </div>

        <div class="seal">
          <div class="seal-info">
            <div class="seal-name">Yugure Kageri</div>
            <div class="seal-handle"></div>
          </div>
          <div class="seal-stamp">夕</div>
        </div>
      </div>

      <div class="meta">
        <span>WEEK 22</span>
        <span class="dot"></span>
        <span>ALL TIMES <b>CST</b></span>
        <span class="dot"></span>
        <span>-5:00 GMT</span>
        <span class="dot"></span>
        <span>SUB ONLY · <b>NONE</b></span>
      </div>

      <div class="schedule" id="schedule-grid">
      </div>

      <div class="footer">
        <div class="channels">
          <div class="ch"><div class="glyph">T</div> twitch.tv / yugurekageri</div>
          <div class="ch"><div class="glyph">Y</div> youtube / @yugurekageri</div>
          <div class="ch">X
@yugurekageri</div>
        </div>
        <div>two tails · one mic · one controller · 猫のままに</div>
      </div>

    </div>

    <!-- =================== RIGHT =================== -->
    <div class="right">

      <div class="moon-ring outer"></div>
      <div class="moon-ring"></div>
      <div class="moon"></div>

      <div class="vkanji">
        夕 暮 翳
        <small>
</small>
      </div>

      <div class="char-wrap">
        <img class="char" id="char-img" src="assets/character.png" alt="Yugure Kageri" />
      </div>

      <div class="info-card">
        <div class="live-dot"></div>
        <div class="info-text">
          <div class="info-label">NEXT STREAM</div>
          <div class="info-value" id="info-value">Wed · Lo-fi &amp; Karaoke · 21:00 JST</div>
        </div>
      </div>

    </div>

  </div>
</div>

<script>
  const ALL_DAYS = [
    { day:'MON', jp:'月' }, { day:'TUE', jp:'火' }, { day:'WED', jp:'水' },
    { day:'THU', jp:'木' }, { day:'FRI', jp:'金' }, { day:'SAT', jp:'土' },
    { day:'SUN', jp:'日' },
  ];

  function render() {
    const schedData = (() => { try { return JSON.parse(localStorage.getItem('stream_schedule')||'[]')||[]; } catch { return []; } })();
    const charUrl  = localStorage.getItem('stream_character_url') || '';
    const charHide = localStorage.getItem('stream_character_hide') === 'true';

    // Character image
    const charImg = document.getElementById('char-img');
    if (charHide) {
      charImg.style.display = 'none';
    } else {
      charImg.style.display = '';
      charImg.src = charUrl || 'assets/character.png';
    }

    // Info card — first scheduled item
    const first = schedData[0];
    const infoEl = document.getElementById('info-value');
    if (first) {
      infoEl.textContent = [first.day, first.game, first.time].filter(Boolean).join(' · ');
    } else {
      infoEl.textContent = '—';
    }

    // Schedule grid — always show all 7 days
    const grid = document.getElementById('schedule-grid');
    grid.innerHTML = '';

    ALL_DAYS.forEach(({ day, jp }) => {
      const item = schedData.find(s => (s.day||'').toUpperCase() === day);
      const card = document.createElement('div');

      if (!item) {
        card.className = 'card off';
        card.innerHTML = `
          <div class="day-block">
            <div class="day-en">${day}</div>
            <div class="day-jp">${jp}</div>
          </div>
          <div class="content-block">
            <div class="activity">— off day —</div>
            <div class="activity-sub">Recharge · see you tomorrow</div>
          </div>`;
      } else {
        const isFeat = !!item.featured;
        const isSpec = !!item.special;
        const hasRibbon = isFeat && isSpec;
        const classes = ['card'];
        if (isFeat) classes.push('featured');
        if (hasRibbon) classes.push('has-ribbon');
        if (isSpec && !isFeat) classes.push('special-star');
        card.className = classes.join(' ');

        const dateHTML = item.date ? `<div class="day-date">${item.date}</div>` : '';
        const subHTML  = item.sub  ? `<div class="activity-sub">${item.sub}</div>` : '';
        const ribbonHTML = hasRibbon ? `<div class="ribbon">★ Special</div>` : '';
        const timeHTML = (item.time || item.note) ? `
          <div class="time-block">
            ${item.time ? `<div class="time">${item.time}</div>` : ''}
            ${item.note ? `<div class="tz">${item.note}</div>` : ''}
          </div>` : '';

        card.innerHTML = `
          <div class="day-block">
            <div class="day-en">${item.day||day}</div>
            <div class="day-jp">${item.jp||jp}</div>
            ${dateHTML}
          </div>
          <div class="content-block">
            <div class="activity">${item.game||''}</div>
            ${subHTML}
          </div>
          ${ribbonHTML}
          ${timeHTML}`;
      }
      grid.appendChild(card);
    });
  }

  render();
  setInterval(render, 5000);
  window.addEventListener('storage', render);

  function scale() {
    const stage = document.getElementById('stage');
    const sx = window.innerWidth / 1920;
    const sy = window.innerHeight / 1080;
    const s = Math.min(sx, sy);
    stage.style.transform = 'scale(' + s + ')';
    document.body.style.height = (1080 * s) + 'px';
    document.body.style.width = (1920 * s) + 'px';
    document.body.style.margin = '0 auto';
  }
  window.addEventListener('resize', scale);
  scale();
</script>
</body>
</html>
