<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Stream Overlays — Yugure Kageri</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;600;700;800&family=Manrope:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  html, body {
    margin: 0; padding: 0;
    background: #07091a;
    font-family: 'Manrope', system-ui, sans-serif;
    color: #f4ecd8;
  }
  @keyframes livePulse {
    0%, 100% { box-shadow: 0 0 12px #ff5b5b, 0 0 0 4px rgba(255,91,91,0.18); }
    50%      { box-shadow: 0 0 18px #ff5b5b, 0 0 0 7px rgba(255,91,91,0.05); }
  }
</style>
</head>
<body>

<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="overlays-shared.jsx"></script>
<script type="text/babel" src="overlay-just-chatting.jsx"></script>
<script type="text/babel" src="overlay-gaming.jsx"></script>
<script type="text/babel" src="overlay-starting-soon.jsx"></script>
<script type="text/babel" src="overlay-brb.jsx"></script>
<script type="text/babel" src="overlay-end-screen.jsx"></script>

<script type="text/babel" data-presets="react">
  function App() {
    return (
      <window.DesignCanvas>
        <window.DCSection id="in-stream" title="In-stream overlays — 配 信 中" subtitle="Chrome that sits over webcam / game capture. 1920 × 1080 · transparent regions stay see-through in OBS.">
          <window.DCArtboard id="just-chatting" label="Just Chatting · 雑談" width={1920} height={1080}>
            <window.JustChattingOverlay />
          </window.DCArtboard>
          <window.DCArtboard id="gaming" label="Gaming · 配信" width={1920} height={1080}>
            <window.GamingOverlay />
          </window.DCArtboard>
        </window.DCSection>
        <window.DCSection id="scenes" title="Scene cards — 場 面" subtitle="Full-bleed transitions: pre-stream, intermission, sign-off. Character art baked in.">
          <window.DCArtboard id="starting-soon" label="Starting Soon · 間もなく" width={1920} height={1080}>
            <window.StartingSoonOverlay />
          </window.DCArtboard>
          <window.DCArtboard id="brb" label="BRB · 一服" width={1920} height={1080}>
            <window.BrbOverlay />
          </window.DCArtboard>
          <window.DCArtboard id="end-screen" label="End Screen · 終了" width={1920} height={1080}>
            <window.EndScreenOverlay />
          </window.DCArtboard>
        </window.DCSection>
      </window.DesignCanvas>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>

</body>
</html>
