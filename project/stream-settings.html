<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Stream Settings — Yugure Kageri</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;600;700;800&family=Manrope:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; }

  html, body {
    margin: 0; padding: 0;
    background: #0d1530;
    color: #f4ecd8;
    font-family: 'Manrope', system-ui, sans-serif;
    min-height: 100vh;
  }

  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: #182144; }
  ::-webkit-scrollbar-thumb { background: #2b2f6e; border-radius: 3px; }

  .page { max-width: 680px; margin: 0 auto; padding: 40px 28px 80px; }

  .header { display: flex; align-items: center; gap: 18px; margin-bottom: 32px; }

  .seal {
    width: 56px; height: 56px;
    background: linear-gradient(135deg, #c93b3b 0%, #8a2424 100%);
    border-radius: 4px;
    display: grid; place-items: center;
    font-family: 'Shippori Mincho', serif;
    font-weight: 800; font-size: 26px; color: #f4ecd8;
    box-shadow: 0 4px 14px rgba(0,0,0,0.5), inset 0 0 0 1.5px rgba(244,236,216,0.25);
    transform: rotate(-4deg); flex-shrink: 0;
  }

  .header-label { font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 4px; color: #6cd6e4; }
  .header-title { font-family: 'Shippori Mincho', serif; font-size: 26px; font-weight: 700; line-height: 1; }
  .header-links { margin-left: auto; display: flex; gap: 10px; align-items: center; }
  .header-link {
    font-family: 'JetBrains Mono', monospace; font-size: 9px; letter-spacing: 2px;
    color: rgba(244,236,216,0.45); text-decoration: none;
    padding: 6px 10px; border: 1px solid rgba(244,236,216,0.15);
  }
  .header-link:hover { color: #6cd6e4; border-color: rgba(108,214,228,0.4); }

  .saved-bar {
    display: none; align-items: center; gap: 10px;
    padding: 10px 18px; margin-bottom: 24px;
    background: rgba(108,214,228,0.08);
    border: 1px solid rgba(108,214,228,0.3);
    font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 2px; color: #6cd6e4;
  }
  .saved-bar.show { display: flex; }

  .card {
    margin-bottom: 24px;
    background: rgba(24,33,68,0.55);
    border: 1px solid rgba(244,236,216,0.1);
  }

  .card-header {
    display: flex; align-items: center; gap: 14px;
    padding: 14px 20px;
    border-bottom: 1px solid rgba(244,236,216,0.08);
  }

  .card-label { font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 3px; color: #e6b558; }
  .card-title { font-family: 'Shippori Mincho', serif; font-size: 17px; font-weight: 700; }

  .card-body { padding: 18px 20px; display: flex; flex-direction: column; gap: 12px; }

  .hint { font-size: 12px; color: rgba(244,236,216,0.45); line-height: 1.5; }
  .hint strong { color: rgba(244,236,216,0.7); font-weight: 600; }

  .field-input {
    width: 100%;
    background: rgba(13,21,48,0.8);
    border: 1px solid rgba(244,236,216,0.18);
    color: #f4ecd8;
    font-family: 'Shippori Mincho', serif;
    font-size: 18px; font-weight: 600;
    padding: 12px 16px;
    outline: none;
    transition: border-color 0.15s;
  }
  .field-input:focus { border-color: #e6b558; }
  .field-input::placeholder { color: rgba(244,236,216,0.25); font-weight: 400; font-size: 15px; }

  .field-input.mono {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px; font-weight: 400; letter-spacing: 0.5px;
  }

  .save-btn {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px; letter-spacing: 3px; text-transform: uppercase;
    padding: 12px 24px;
    background: rgba(230,181,88,0.12);
    border: 1px solid #e6b558;
    color: #e6b558;
    cursor: pointer;
    transition: background 0.15s;
    width: 100%;
  }
  .save-btn:hover { background: rgba(230,181,88,0.2); }
  .save-btn:active { transform: scale(0.98); }

  .save-btn.cyan {
    background: rgba(108,214,228,0.1);
    border-color: #6cd6e4; color: #6cd6e4;
  }
  .save-btn.cyan:hover { background: rgba(108,214,228,0.2); }

  /* Schedule rows */
  .sched-row { display: flex; gap: 8px; align-items: center; }
  .sched-row .field-input { font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 400; letter-spacing: 0.5px; padding: 10px 12px; }
  .sched-row .day-inp { width: 76px; flex: none; }
  .sched-row .jp-inp  { width: 50px; flex: none; }
  .sched-row .game-inp { flex: 1; }
  .del-btn {
    font-family: 'JetBrains Mono', monospace; font-size: 11px;
    padding: 10px 12px; background: transparent;
    border: 1px solid rgba(244,236,216,0.15); color: rgba(244,236,216,0.4);
    cursor: pointer; flex: none;
  }
  .del-btn:hover { border-color: #ff5b5b; color: #ff5b5b; }

  .row-btns { display: flex; gap: 10px; }
  .ghost-btn {
    font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 2px;
    padding: 10px 16px; background: transparent;
    border: 1px solid rgba(244,236,216,0.2); color: rgba(244,236,216,0.5);
    cursor: pointer; text-transform: uppercase;
  }
  .ghost-btn:hover { border-color: rgba(244,236,216,0.4); color: rgba(244,236,216,0.8); }

  .toast {
    position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: rgba(13,21,48,0.97); border: 1px solid #e6b558; color: #e6b558;
    font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 2.5px;
    padding: 10px 20px; opacity: 0; transition: opacity 0.2s, transform 0.2s; pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div class="page">

  <div class="header">
    <div class="seal">夕</div>
    <div style="display:flex;flex-direction:column;gap:4px">
      <div class="header-label">STREAM SETTINGS · 配信 設定</div>
      <div class="header-title">Stream Settings</div>
    </div>
    <div class="header-links">
      <a class="header-link" href="twitch-setup.html">TWITCH SETUP</a>
    </div>
  </div>

  <!-- STREAM TITLE -->
  <div class="card">
    <div class="card-header">
      <span class="card-label">01</span>
      <span class="card-title">Stream Title</span>
    </div>
    <div class="card-body">
      <div class="hint">Shown in the <strong>Just Chatting</strong> top banner. Updates live across all overlays within ~5 s.</div>
      <input class="field-input" type="text" id="title-input"
             placeholder="e.g. Tail-flicks, vinyl & weekly mews"
             spellcheck="false" autocomplete="off" />
      <button class="save-btn" onclick="saveTitle()">SAVE TITLE</button>
    </div>
  </div>

  <!-- SCHEDULE -->
  <div class="card">
    <div class="card-header">
      <span class="card-label">02</span>
      <span class="card-title">Stream Schedule</span>
    </div>
    <div class="card-body">
      <div class="hint">Shown on <strong>Starting Soon</strong> and <strong>End Screen</strong>. Up to 7 days.</div>
      <div id="sched-rows" style="display:flex;flex-direction:column;gap:8px"></div>
      <div class="row-btns">
        <button class="ghost-btn" onclick="addRow()" style="flex:none">+ ADD DAY</button>
        <button class="save-btn cyan" onclick="saveSchedule()" style="flex:1">SAVE SCHEDULE</button>
      </div>
    </div>
  </div>

</div>

<div class="toast" id="toast"></div>

<script>
  const DAY_KANJI = { MON:'月', TUE:'火', WED:'水', THU:'木', FRI:'金', SAT:'土', SUN:'日' };

  function toast(msg) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    setTimeout(() => el.classList.remove('show'), 2000);
  }

  // ── Title ──────────────────────────────────────────────
  function saveTitle() {
    const val = document.getElementById('title-input').value.trim();
    localStorage.setItem('stream_title', val);
    toast('TITLE SAVED — overlays update in ~5 s');
  }

  // ── Schedule ──────────────────────────────────────────
  let scheduleData = [];

  function renderRows() {
    const container = document.getElementById('sched-rows');
    container.innerHTML = '';
    scheduleData.forEach((row, i) => {
      const wrap = document.createElement('div');
      wrap.className = 'sched-row';
      wrap.innerHTML = `
        <input class="field-input day-inp" placeholder="MON" value="${row.day||''}" data-i="${i}" data-f="day" />
        <input class="field-input jp-inp"  placeholder="月"   value="${row.jp||''}"  data-i="${i}" data-f="jp"  />
        <input class="field-input game-inp" placeholder="Activity / game title" value="${row.game||''}" data-i="${i}" data-f="game" />
        <button class="del-btn" onclick="delRow(${i})">✕</button>
      `;
      wrap.querySelectorAll('input').forEach(inp => {
        inp.addEventListener('input', e => {
          const idx = +e.target.dataset.i, field = e.target.dataset.f;
          scheduleData[idx][field] = e.target.value;
          if (field === 'day') {
            const k = DAY_KANJI[e.target.value.toUpperCase()];
            if (k) { scheduleData[idx].jp = k; wrap.querySelector('[data-f="jp"]').value = k; }
          }
        });
      });
      container.appendChild(wrap);
    });
  }

  function addRow() {
    if (scheduleData.length >= 7) { toast('MAX 7 DAYS'); return; }
    scheduleData.push({ day: '', jp: '', game: '' });
    renderRows();
  }

  function delRow(i) { scheduleData.splice(i, 1); renderRows(); }

  function saveSchedule() {
    const clean = scheduleData.filter(r => r.day || r.game);
    localStorage.setItem('stream_schedule', JSON.stringify(clean));
    toast('SCHEDULE SAVED');
  }

  // ── Init ──────────────────────────────────────────────
  const savedTitle = localStorage.getItem('stream_title') || '';
  document.getElementById('title-input').value = savedTitle;

  try {
    const saved = JSON.parse(localStorage.getItem('stream_schedule') || 'null');
    scheduleData = Array.isArray(saved) ? saved : [
      { day: 'TUE', jp: '火', game: 'Horror Night · Faith III' },
      { day: 'WED', jp: '水', game: 'Lo-fi & Karaoke' },
      { day: 'FRI', jp: '金', game: 'Elden Ring DLC · Boss Rush' },
    ];
  } catch {
    scheduleData = [
      { day: 'TUE', jp: '火', game: 'Horror Night · Faith III' },
      { day: 'WED', jp: '水', game: 'Lo-fi & Karaoke' },
      { day: 'FRI', jp: '金', game: 'Elden Ring DLC · Boss Rush' },
    ];
  }
  renderRows();
</script>
</body>
</html>
